<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civora AI — Guidance</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7952FC;
      --primary-light: #9D7BFF;
      --primary-dark: #582FD6;
      --primary-glow: rgba(121, 82, 252, 0.45);
      --accent: #00F0FF;
      --accent-light: #70F7FF;
      --accent-dark: #00B8D9;
      --accent-glow: rgba(0, 240, 255, 0.35);
      --success: #00F59B;
      --success-glow: rgba(0, 245, 155, 0.35);
      --warning: #FFB800;
      --error: #FF3366;

      --bg-primary: #060713;
      --bg-secondary: #0D0F24;
      --bg-card: rgba(15, 18, 45, 0.95);
      --surface-1: rgba(255, 255, 255, 0.03);
      --surface-2: rgba(255, 255, 255, 0.06);
      --surface-3: rgba(255, 255, 255, 0.1);

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-default: rgba(255, 255, 255, 0.15);

      --text-primary: #FFFFFF;
      --text-secondary: rgba(240, 242, 255, 0.75);
      --text-tertiary: rgba(240, 242, 255, 0.48);

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --radius-sm: 0.5rem;
      --radius-md: 0.75rem;
      --radius-lg: 1.125rem;
      --radius-xl: 1.5rem;
      --radius-full: 9999px;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;

      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(121, 82, 252, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(0, 240, 255, 0.12) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== Title Bar (draggable) ===== */
    .popup-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-2) var(--space-3);
      background: rgba(10, 10, 26, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      /* app-region: drag would only work in Electron */
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .titlebar-logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .titlebar-name {
      font-size: var(--text-sm);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .titlebar-badge {
      font-size: 0.6rem;
      font-weight: 600;
      padding: 1px 6px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-full);
      color: white;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--text-xs);
      color: var(--success);
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse-dot 2s infinite;
    }

    .status-indicator.disconnected {
      color: var(--text-tertiary);
    }

    .status-indicator.disconnected .status-dot {
      background: var(--text-tertiary);
      animation: none;
    }

    /* ===== Main Content ===== */
    .popup-content {
      flex: 1;
      overflow-y: auto;
      position: relative;
      z-index: 1;
    }

    /* Accent gradient bar */
    .gradient-bar {
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--success));
      background-size: 200% 100%;
      animation: gradientSlide 3s ease infinite;
    }

    /* ===== Step Header ===== */
    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
    }

    .step-badge {
      font-size: var(--text-xs);
      font-weight: 700;
      padding: 3px 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-full);
      color: white;
      letter-spacing: 0.02em;
    }

    .step-screen-title {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== Instruction Block ===== */
    .instruction-block {
      margin: var(--space-3) var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: rgba(0, 210, 255, 0.06);
      border: 1px solid rgba(0, 210, 255, 0.12);
      border-radius: var(--radius-lg);
      display: flex;
      gap: var(--space-3);
      transition: all 0.3s ease;
    }

    .instruction-block.highlight {
      border-color: rgba(0, 210, 255, 0.35);
      background: rgba(0, 210, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.08);
    }

    .instruction-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .instruction-content {
      flex: 1;
      min-width: 0;
    }

    .instruction-text {
      font-size: var(--text-sm);
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .instruction-target {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      margin-top: var(--space-1);
    }

    .instruction-target:empty {
      display: none;
    }

    /* ===== Tip ===== */
    .tip-block {
      margin: 0 var(--space-4) var(--space-3);
      padding: var(--space-2) var(--space-3);
      background: var(--surface-1);
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      line-height: 1.5;
    }

    /* ===== Security ===== */
    .security-block {
      margin: 0 var(--space-4) var(--space-3);
      padding: var(--space-2) var(--space-3);
      background: rgba(255, 214, 0, 0.06);
      border: 1px solid rgba(255, 214, 0, 0.12);
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      color: var(--warning);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    /* ===== Progress ===== */
    .progress-block {
      padding: var(--space-3) var(--space-4);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-shrink: 0;
      background: rgba(10, 10, 26, 0.5);
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--surface-2);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: var(--radius-full);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }

    .progress-label {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ===== Empty State ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      text-align: center;
      flex: 1;
    }

    .empty-state .empty-icon {
      font-size: 2.5rem;
      opacity: 0.3;
      margin-bottom: var(--space-3);
      animation: float 3s ease-in-out infinite;
    }

    .empty-state p {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
      line-height: 1.6;
      max-width: 240px;
    }

    /* ===== Error State ===== */
    .error-state .instruction-block {
      border-color: rgba(255, 82, 82, 0.2);
      background: rgba(255, 82, 82, 0.06);
    }

    /* ===== Analyzing spinner ===== */
    .analyzing-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      flex: 1;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--surface-3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: var(--space-3);
    }

    .analyzing-label {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      animation: pulse-text 1.5s infinite;
    }

    /* ===== Completion ===== */
    .complete-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      text-align: center;
      flex: 1;
    }

    .complete-state .complete-icon {
      font-size: 3rem;
      margin-bottom: var(--space-3);
    }

    .complete-state h3 {
      font-size: var(--text-lg);
      font-weight: 700;
      margin-bottom: var(--space-2);
    }

    .complete-state p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    /* ===== Keep on Top hint ===== */
    .keep-on-top-hint {
      padding: var(--space-2) var(--space-3);
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-tertiary);
      background: var(--surface-1);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: var(--radius-full); }

    /* ===== Animations ===== */
    @keyframes gradientSlide {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
      50% { opacity: 0.8; box-shadow: 0 0 0 4px transparent; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in-up {
      animation: fadeInUp 0.35s ease-out;
    }
  </style>
</head>
<body>

  <!-- Title Bar -->
  <div class="popup-titlebar">
    <div class="titlebar-left">
      <div class="titlebar-logo">🎯</div>
      <span class="titlebar-name">Civora</span>
      <span class="titlebar-badge">AI</span>
    </div>
    <div class="status-indicator" id="statusIndicator">
      <div class="status-dot"></div>
      <span id="statusText">Connected</span>
    </div>
  </div>

  <!-- Gradient accent bar -->
  <div class="gradient-bar"></div>

  <!-- Dynamic content area -->
  <div class="popup-content" id="popupContent">
    <!-- Initially shows waiting state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎯</div>
      <p>Waiting for screen analysis...<br>Start screen sharing in the main tab.</p>
    </div>
  </div>

  <!-- Progress footer -->
  <div class="progress-block" id="progressBlock" style="display: none;">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel">—</span>
  </div>

  <!-- Keep on top hint -->
  <div class="keep-on-top-hint">
    Keep this window visible while working in other tabs
  </div>

  <script>
    /**
     * Civora AI — Guidance Popup Window
     * Receives guidance updates from the parent window via postMessage.
     */

    const ACTION_ICONS = {
      'tap': '👆', 'type': '⌨️', 'select': '☑️',
      'scroll': '📜', 'upload': '📎', 'wait': '⏳'
    };

    const contentEl = document.getElementById('popupContent');
    const progressBlock = document.getElementById('progressBlock');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');

    // Listen for messages from the main Civora window
    window.addEventListener('message', (event) => {
      const { type, payload } = event.data || {};

      switch (type) {
        case 'civora:guidance':
          renderGuidance(payload.analysis, payload.progress);
          break;
        case 'civora:analyzing':
          renderAnalyzing();
          break;
        case 'civora:error':
          renderError(payload.message);
          break;
        case 'civora:complete':
          renderComplete();
          break;
        case 'civora:empty':
          renderEmpty(payload?.message);
          break;
        case 'civora:ping':
          // Keep alive heartbeat
          setConnected(true);
          break;
        case 'civora:disconnected':
          setConnected(false);
          break;
      }
    });

    // Notify opener that we're ready
    if (window.opener) {
      window.opener.postMessage({ type: 'civora:popup-ready' }, '*');
    }

    // Detect if parent window closes
    const parentCheck = setInterval(() => {
      if (!window.opener || window.opener.closed) {
        setConnected(false);
        clearInterval(parentCheck);
      }
    }, 2000);

    function setConnected(connected) {
      if (connected) {
        statusIndicator.classList.remove('disconnected');
        statusText.textContent = 'Connected';
      } else {
        statusIndicator.classList.add('disconnected');
        statusText.textContent = 'Disconnected';
      }
    }

    function renderGuidance(analysis, progress) {
      const action = analysis.nextAction;
      const icon = ACTION_ICONS[action?.actionType] || '👆';

      let html = `
        <div class="step-header fade-in-up">
          <span class="step-badge">Step ${analysis.stepNumber || '?'} of ${analysis.totalStepsEstimate || '?'}</span>
          <span class="step-screen-title">${analysis.screenTitle || ''}</span>
        </div>

        <div class="instruction-block highlight fade-in-up">
          <div class="instruction-icon">${icon}</div>
          <div class="instruction-content">
            <div class="instruction-text">${action?.instruction || 'Analyzing...'}</div>
            <div class="instruction-target" id="instrTarget"></div>
          </div>
        </div>
      `;

      // Tip
      if (analysis.tip) {
        html += `
          <div class="tip-block fade-in-up">
            <span>💡</span>
            <span>${analysis.tip}</span>
          </div>
        `;
      }

      // Security
      if (analysis.isSecurityBoundary) {
        html += `
          <div class="security-block fade-in-up">
            <span>🔒</span>
            <span>${analysis.securityNote || 'This step requires your manual input for security.'}</span>
          </div>
        `;
      }

      contentEl.innerHTML = html;

      // Set target (after innerHTML so element exists)
      const targetEl = document.getElementById('instrTarget');
      if (targetEl && action?.targetElement) {
        targetEl.textContent = `Target: ${action.targetElement}`;
        if (action.targetLocation?.description) {
          targetEl.textContent += ` · ${action.targetLocation.description}`;
        }
      }

      // Remove highlight after 2 seconds
      setTimeout(() => {
        const block = contentEl.querySelector('.instruction-block');
        if (block) block.classList.remove('highlight');
      }, 2000);

      // Progress
      if (progress) {
        progressBlock.style.display = '';
        progressFill.style.width = `${progress.percentage || 0}%`;
        progressLabel.textContent = `${progress.current || 0}/${progress.total || '?'}`;
      }
    }

    function renderAnalyzing() {
      contentEl.innerHTML = `
        <div class="analyzing-state fade-in-up">
          <div class="spinner"></div>
          <div class="analyzing-label">Analyzing your screen...</div>
        </div>
      `;
    }

    function renderError(message) {
      contentEl.innerHTML = `
        <div class="error-state fade-in-up">
          <div class="instruction-block">
            <div class="instruction-icon">⚠️</div>
            <div class="instruction-content">
              <div class="instruction-text">${message || 'An error occurred'}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderComplete() {
      contentEl.innerHTML = `
        <div class="complete-state fade-in-up">
          <div class="complete-icon">🎉</div>
          <h3>Process Complete!</h3>
          <p>You've successfully completed all the steps. Great job!</p>
        </div>
      `;

      progressBlock.style.display = '';
      progressFill.style.width = '100%';
      progressLabel.textContent = 'Done!';
    }

    function renderEmpty(message) {
      contentEl.innerHTML = `
        <div class="empty-state fade-in-up">
          <div class="empty-icon">🎯</div>
          <p>${message || 'Waiting for screen analysis...'}</p>
        </div>
      `;
      progressBlock.style.display = 'none';
    }
  </script>
</body>
</html>
